# Security headers for rentcar.alyxlabs.tech. Install as /etc/nginx/snippets/rentcar-headers.conf
# after certbot has issued the certificate (steps in deploy/RUNBOOK.md).
#
# Included inside each location of the rentcar site, after that location's Cache-Control:
# nginx drops inherited add_header lines in any location that sets its own.
#
# HSTS covers this host only. No preload: alyxlabs.tech and its other subdomains are not part of this decision.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Report-Only first. After a day without CSP violations in the browser console, rename the header
# to Content-Security-Policy (RUNBOOK section "CSP enforce").
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
