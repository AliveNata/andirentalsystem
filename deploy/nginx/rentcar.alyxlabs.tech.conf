# Host nginx site for ARMJ. Install as /etc/nginx/sites-available/rentcar.alyxlabs.tech
# and symlink into sites-enabled (steps in deploy/RUNBOOK.md).
#
# HTTP only on purpose: `certbot --nginx -d rentcar.alyxlabs.tech --redirect` adds the
# `listen 443 ssl` lines and the port 80 -> 301 https block, same layout as the other sites on the host.
#
# nginx drops server-level add_header in any location that sets its own add_header, so each
# location includes the security header snippet (deploy/nginx/rentcar-headers.conf) itself.

# This file is included inside http{}, so the zone is defined here. 5 login attempts per minute per client IP.
limit_req_zone $binary_remote_addr zone=rentcar_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name rentcar.alyxlabs.tech;

    server_tokens off;

    root /var/www/rentcar;
    index index.html;

    # Regex, case-insensitive: /api/Login and /api//login/ must hit the same limit.
    location ~* ^/api/+login/*$ {
        limit_req zone=rentcar_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        client_max_body_size 16k;

        include /etc/nginx/snippets/rentcar-headers.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        client_max_body_size 25m;

        include /etc/nginx/snippets/rentcar-headers.conf;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/rentcar-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/rentcar-headers.conf;
    }

    # SPA fallback: unknown paths are served index.html (internal redirect hits the no-cache block above).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/rentcar-headers.conf;
    }

    location ~ /\. {
        deny all;
    }
}
